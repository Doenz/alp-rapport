# =========================================================================
# Supabase Keep-Alive
# =========================================================================
# Verhindert, dass das Supabase-Projekt nach 7 Tagen Inaktivität pausiert.
# Führt automatisch 2x pro Woche (Montag + Donnerstag, 08:00 UTC) einen
# einfachen REST-Call gegen die Datenbank aus — das zählt als Aktivität.
#
# GitHub führt Cron-Jobs auf ihren Servern aus, kostenlos.
#
# Einrichtung: siehe README-Abschnitt unten oder SETUP.md.
# =========================================================================

name: Supabase Keep-Alive

on:
  schedule:
    # Montag und Donnerstag um 08:00 UTC (= 09:00 Winterzeit / 10:00 Sommerzeit in CH)
    - cron: '0 8 * * 1,4'
  # Manuell auslösbar über GitHub → Actions → Run workflow
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase REST-API
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Supabase pingen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL und SUPABASE_ANON_KEY sind nicht gesetzt."
            echo "Gehe zu Settings → Secrets and variables → Actions und lege beide an."
            exit 1
          fi

          # Für Keep-Alive zählt: Supabase antwortet überhaupt (egal mit welchem HTTP-Status).
          # Nur ein komplett fehlschlagender Request (Netzwerk-Timeout = Status 000)
          # ist ein echter Fehler.

          ping() {
            local url="$1"
            local code
            code=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" \
              "$url" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo "000")
            echo "  Status $code → $url"
            if [ "$code" = "000" ]; then
              return 1
            fi
            return 0
          }

          echo "==> Ping Auth-Settings (immer öffentlich erreichbar)"
          ping "$SUPABASE_URL/auth/v1/settings" || {
            echo "::error::Auth-Endpoint antwortet nicht — Projekt offline?"
            exit 1
          }

          echo "==> Ping SELECT auf keep_alive (öffentlich lesbar, erzwingt echten DB-Zugriff)"
          code=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo "000")
          echo "  Status $code"
          if [ "$code" = "000" ]; then
            echo "::error::DB-Ping fehlgeschlagen — Projekt offline oder keep_alive-Tabelle fehlt (siehe SQL)."
            exit 1
          fi

          echo "✅ Keep-Alive erfolgreich — DB hat geantwortet (Status $code), Projekt bleibt aktiv."
